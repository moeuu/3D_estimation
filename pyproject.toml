[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "three-d-estimation"
version = "0.2.0"
description = "Surface MLE estimator for shared rotating-shield MeasurementLog data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.10.7",
  "numpy>=2.3.5",
  "rotating-shield-simulation-runtime==0.1.0",
  "scipy>=1.16.3",
  "threadpoolctl>=3.6.0",
  "torch",
]

[dependency-groups]
dev = [
  "pytest>=9.0.1",
  "ruff>=0.15.9",
]

[project.scripts]
estimate-radiation-mle = "three_d_estimation.cli:main"
estimate-radiation = "three_d_estimation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "three_d_estimation*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
rotating-shield-simulation-runtime = { git = "ssh://git@github.com/moeuu/radiation-simulation-runtime.git", rev = "421d4e0715c7a71d7323b909dbf6caa37e05d251" }
